services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be at least 32 bytes}
      HOST: 0.0.0.0
      PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-}
      BOOTSTRAP_CURRENCY: ${BOOTSTRAP_CURRENCY:-}
      BOOTSTRAP_UNPAID_HOLD_MINUTES: ${BOOTSTRAP_UNPAID_HOLD_MINUTES:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-3000}:3000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BOOKING_API_ORIGIN: ${NEXT_PUBLIC_BOOKING_API_ORIGIN-http://localhost:3000}
        NEXT_PUBLIC_TECHWING_QUICK_DEMO: ${NEXT_PUBLIC_TECHWING_QUICK_DEMO:-0}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-3001}:3001"

volumes:
  pgdata:
